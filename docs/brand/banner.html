<!doctype html>
<!-- README banner, 1280x400. Render each theme to docs/assets/banner-dark.png and
     banner-light.png at 2x (open with ?theme=light for the light one). -->
<html>
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400..600&family=Google+Sans+Code:wght@400..600&display=swap" />
<style>
  :root { --bg: #090909; --ink: #f8f8f8; --sub: #8a8a8a; --line: #252525; }
  html.light { --bg: #fbfbfb; --ink: #0f0f0f; --sub: #676767; --line: #e5e5e5; }
  html, body { margin: 0; width: 1280px; height: 400px; background: var(--bg); overflow: hidden; }
  .frame { position: relative; width: 1280px; height: 400px; font-family: "Google Sans", sans-serif; color: var(--ink); }
  .rail { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--line); }
  .line { position: absolute; left: 12px; right: 12px; height: 1px; background: var(--line); }
  .gap { position: absolute; width: 24px; height: 24px; background: var(--bg); }
  .brand { position: absolute; left: 96px; top: 52px; display: flex; align-items: center; gap: 12px; font-size: 30px; font-weight: 600; letter-spacing: -0.02em; }
  h1 { position: absolute; left: 96px; bottom: 112px; margin: 0; font-weight: 400; font-size: 58px; line-height: 1.02; letter-spacing: -0.045em; }
  h1 span { color: var(--sub); display: block; }
  .foot { position: absolute; left: 96px; bottom: 60px; font-family: "Google Sans Code", monospace; font-size: 17px; color: var(--sub); }
  svg.field { position: absolute; right: 70px; top: 40px; transform: scale(0.92); transform-origin: right top; }
</style>
</head>
<body>
<script>if (new URLSearchParams(location.search).get("theme") === "light") document.documentElement.classList.add("light");</script>
<div class="frame">
  <div class="rail" style="left:60px"></div><div class="rail" style="left:1220px"></div>
  <div class="line" style="top:24px"></div><div class="line" style="top:376px"></div>
  <div class="gap" style="left:48px;top:12px"></div><div class="gap" style="left:1208px;top:12px"></div>
  <div class="gap" style="left:48px;top:364px"></div><div class="gap" style="left:1208px;top:364px"></div>
  <div class="brand">
    <svg width="40" height="40" viewBox="0 0 32 32" fill="none"><path d="M8.81 17.50 L4.4 25.4 L27.6 25.4 L16 4.6 L12.52 10.84" stroke="var(--ink)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="10.66" cy="14.17" r="2.7" fill="var(--ink)"/></svg>
    vpcdiff
  </div>
  <svg class="field" width="560" height="300" viewBox="0 0 560 300" font-family="Google Sans Code, monospace">
    <g fill="var(--ink)">
      <script>
        const g = document.currentScript.parentNode;
        for (let c = 0; c < 14; c++) for (let r = 0; r < 8; r++) {
          const x = 20 + c * 40, y = 20 + r * 36, d = Math.hypot(x - 330, (y - 140) * 1.3), s = Math.min(6, 8 - d / 50);
          if (s < 1.2) continue;
          const e = document.createElementNS("http://www.w3.org/2000/svg", "rect");
          e.setAttribute("x", x - s / 2); e.setAttribute("y", y - s / 2); e.setAttribute("width", s); e.setAttribute("height", s);
          e.setAttribute("opacity", (Math.max(0.1, 1 - d / 420) * 0.4).toFixed(2)); g.appendChild(e);
        }
      </script>
    </g>
    <polyline points="140,128 220,92 300,164 380,128 460,200" fill="none" stroke="var(--ink)" stroke-width="2" />
    <g fill="var(--ink)">
      <rect x="133" y="121" width="14" height="14"/><rect x="213" y="85" width="14" height="14"/><rect x="293" y="157" width="14" height="14"/><rect x="373" y="121" width="14" height="14"/><rect x="449" y="189" width="22" height="22"/>
    </g>
    <rect x="441" y="181" width="38" height="38" fill="none" stroke="var(--ink)" stroke-opacity="0.35"/>
    <g font-size="14" fill="var(--ink)" stroke="var(--bg)" stroke-width="6" paint-order="stroke">
      <text x="110" y="160">internet</text><text x="232" y="80">gateway</text><text x="300" y="196">nacl</text><text x="392" y="112">security group</text>
      <text x="390" y="246" font-size="16">aws_instance.db</text>
    </g>
  </svg>
  <h1>See what a Terraform plan<span>opens to the internet.</span></h1>
  <div class="foot">Free and open source · offline · before you apply</div>
</div>
</body>
</html>
