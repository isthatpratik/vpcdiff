# Keeps the pinned GitHub Actions (full commit SHAs) and the npm dependencies current, so
# a fix for a known issue arrives as a pull request. Each update is reviewed like any other
# change: CI must pass, and the committed Action bundle must still match its sources.
#
# The repository is one pnpm workspace with one lockfile, so one directory covers it.
# Major versions are not proposed automatically: a new major (TypeScript, @types/node,
# lucide-react, which is pinned on purpose) is a deliberate change with its own pull request.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Pinned to an exact version on purpose: the viewer's icons are part of its look, and a
      # 0.x minor can redraw them. An upgrade is a deliberate change with a visual check.
      - dependency-name: "lucide-react"
    groups:
      dev-dependencies:
        dependency-type: development
    commit-message:
      prefix: "chore(deps)"
