name: OpenTofu

# Plans every fixture with OpenTofu and checks that the engine gives the same result,
# byte for byte, as for the committed Terraform plan (#34). It downloads the AWS
# provider from registry.opentofu.org; no AWS account or credentials are used.

on:
  pull_request:
    paths:
      - "fixtures/**"
      - "packages/engine/**"
      - "scripts/make-fixture-plan.ts"
      - ".github/workflows/opentofu.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: opentofu-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.13.9
          tofu_wrapper: false
      # make-fixture-plan.ts keeps providers in $TMPDIR/vpcdiff-tofu-plugin-cache.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/vpcdiff-tofu-plugin-cache
          key: tofu-plugins-${{ hashFiles('fixtures/**/main.tf') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm vitest run fixtures/opentofu.test.ts
        env:
          VPCDIFF_TOFU: "1"
          TMPDIR: ${{ runner.temp }}
