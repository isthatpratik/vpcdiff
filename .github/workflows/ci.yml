name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Reads the pnpm version from "packageManager" in package.json.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Check that the viewer build blocks network requests
        run: grep -q "connect-src 'none'" apps/viewer/dist/app/index.html
      - name: Check that the committed action bundle is up to date
        run: git diff --exit-code -- packages/action/dist || (echo "::error::packages/action/dist is stale. Run pnpm build and commit it." && exit 1)
      - name: Run the action on a fixture
        id: smoke
        uses: ./
        with:
          plan: fixtures/sg-5432-opened/plan.json
          comment: "false"
          fail-on: never
      - name: Check the action outputs
        env:
          ADDED: ${{ steps.smoke.outputs.added }}
        run: test "$ADDED" = "1"
