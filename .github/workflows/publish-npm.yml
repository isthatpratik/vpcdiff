name: Publish to npm

# Publishes the `vpcdiff` CLI package to npm with provenance when a GitHub release is
# published. It uses npm trusted publishing (OIDC): no npm token is stored in this
# repository. One-time setup on npmjs.com, under the package's Settings > Trusted
# publisher: repository isthatpratik/vpcdiff, workflow publish-npm.yml, environment npm.
# Docs: https://docs.npmjs.com/trusted-publishers
# The "npm" environment should require a reviewer (repository Settings > Environments).

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write # npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      - name: Check the tag matches the package version
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(node -p "require('./packages/cli/package.json').version")
          test "$TAG" = "v$version" || { echo "Tag $TAG does not match package version $version"; exit 1; }
      - name: Publish
        working-directory: packages/cli
        run: pnpm publish --provenance --access public --no-git-checks
